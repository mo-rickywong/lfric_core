meta=lfric-JediBones/vn3.1

[command]
default=$LAUNCH_SCRIPT/launch-exe

[env]
EXEC_NAME=JediBones
OMP_NUM_THREADS=1
TOTAL_RANKS=1
!!XIOS_SERVER_MODE=False
!!XIOS_SERVER_RANKS=1

[file:$DESTINATION_DIRECTORY]
mode=mkdir

[file:Season1.nml]
mode=auto
source=namelist:base_mesh
      =namelist:extrusion
      =namelist:finite_element
      =namelist:io
      =namelist:logging
      =namelist:planet
      =namelist:partitioning
      =namelist:time
      =namelist:timestepping
      =namelist:donkey(season1)
      =namelist:master(season1)
      =namelist:pleb(season1)
      =namelist:sith(season1)
      =namelist:weapon(season1)

[file:Season2.nml]
mode=auto
source=namelist:base_mesh
      =namelist:extrusion
      =namelist:finite_element
      =namelist:io
      =namelist:logging
      =namelist:planet
      =namelist:partitioning
      =namelist:time
      =namelist:timestepping
      =namelist:donkey(season2)
      =namelist:master(season2)
      =namelist:pleb(season2)
      =namelist:sith(season2)
      =namelist:weapon(season2)

[namelist:base_mesh]
f_lat_deg=45.0
file_prefix=''
fplane=.false.
geometry='planar'
prepartitioned=.false.
prime_mesh_name='dynamics'
topology='fully_periodic'

[namelist:donkey(season1)]
age=34
capacity=2.75
fuel='snickers'
name='The Rush'
weight=6.0

[namelist:donkey(season2)]
age=26
capacity=20.3
fuel='turnips'
name='bill'
weight=4.5

[namelist:extrusion]
domain_height=1000.0
!!eta_values=''
method='uniform'
number_of_layers=1
planet_radius=6371229.0

[namelist:finite_element]
cellshape='quadrilateral'
coord_order=1
coord_system='xyz'
element_order_h=0
element_order_v=0
rehabilitate=.true.

[namelist:io]
checkpoint_read=.false.
!!checkpoint_times=
checkpoint_write=.false.
counter_output_suffix='counter.txt'
diagnostic_frequency=1
!!end_of_run_checkpoint=.true.
file_convention='UGRID'
nodal_output_on_w3=.false.
subroutine_counters=.false.
subroutine_timers=.false.
timer_output_path='timer.txt'
use_xios_io=.false.
write_diag=.false.

[namelist:logging]
log_to_rank_zero_only=.false.
run_log_level='info'

[namelist:master(season1)]
age=23
height=3.4
name='bob'
own_series=.true.
street_cred=2

[namelist:master(season2)]
age=27
height=2.4
name='Curly'
own_series=.true.
street_cred=1

[namelist:multigrid]
chain_mesh_tags=''
multigrid_chain_nitems=1

[namelist:partitioning]
generate_inner_halos=.true.
panel_decomposition='auto'
!!panel_xproc=1
!!panel_yproc=1
partitioner='planar'

[namelist:planet]
scaling_factor=125.0

[namelist:pleb(season1)]
age=26
for_fodder=.false.
name='redshirt'
race='not turnips'

[namelist:pleb(season2)]
age=26
for_fodder=.false.
name='redshirt'
race='not turnips'

[namelist:sith(season1)]
age=26
height=3.4
name='bill'
own_series=.false.
street_cred=20

[namelist:sith(season2)]
age=230
height=4.4
name='Beasty'
own_series=.true.
street_cred=15

[namelist:time]
calendar='timestep'
calendar_origin='2016-01-01 15:00:00'
calendar_start='2016-01-01 15:00:00'
calendar_type='gregorian'
timestep_end='10'
timestep_start='1'

[namelist:timestepping]
dt=1.0
spinup_period=0.0

[namelist:weapon(season1)]
defensive=.false.
name='lemon'
onehanded=.true.
special_move='pancake pickle'
strike_damage=20

[namelist:weapon(season2)]
defensive=.true.
name='bin'
onehanded=.false.
special_move='smash'
strike_damage=5
